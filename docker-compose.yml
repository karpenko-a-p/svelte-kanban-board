services:
  postgres:
    image: postgres:18.4-alpine3.24
    container_name: postgres-database
    restart: unless-stopped
    networks:
      - local
    ports:
      - '5432:5432'
    volumes:
      - database-storage:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: admin
      POSTGRES_DB: my_database
      PGDATA: /var/lib/postgresql/data/pgdata
      PGTZ: 'UTC'
      TZ: 'UTC'
    healthcheck:
      test: pg_isready -U admin -d my_database
      interval: 10s
      timeout: 10s
      retries: 3

  migrations:
    image: amacneil/dbmate:2.35.0
    container_name: dbmate-migrations
    restart: no
    networks:
      - local
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/db/migrations:ro
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/main?sslmode=disable
    command: --wait up

  redis:
    image: redis:8.6-alpine3.23
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - local
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 10s
      retries: 3

  application:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: svelte-application
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - local
    volumes:
      - ./logs.db:/app/logs.db
      - ./media-storage:/app/media-storage
    environment:
      JWT_SECRET: my-super-puper-duper-secret-key-for-my-jwt-token
      DATABASE_URL: postgresql://admin:password@postgres:5432/my_database?sslmode=disable
      REDIS_URL: redis://redis:6379
      BODY_SIZE_LIMIT: 51M
      PORT: 3000
      TZ: Europe/Moscow
    healthcheck:
      test: wget -q --spider http://127.0.0.1:3000/api/v1/health
      interval: 10s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.29.4-alpine3.23-slim
    container_name: nginx
    restart: unless-stopped
    depends_on:
      application:
        condition: service_healthy
    ports:
      - "443:443"
    networks:
      - local
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/ssl:ro
    healthcheck:
      test: wget --no-check-certificate -q --spider https://127.0.0.1/health
      interval: 5s
      timeout: 10s
      retries: 3

  autohill:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 15
      AUTOHEAL_START_PERIOD: 30
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 10
      CURL_TIMEOUT: 30

volumes:
  database-storage:

networks:
  local:
    driver: bridge
