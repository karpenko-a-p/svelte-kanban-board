events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;
  server_tokens off;

  # политики ограничений
  limit_req_zone $binary_remote_addr zone=main:25m rate=75r/s;
  limit_req_zone $binary_remote_addr zone=media:25m rate=100r/s;
  limit_req_log_level warn;
  limit_req_status 429;

  # Компрессия толкьо для html и шрифтов (остальное уже сжато при билде)
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 16384; # 16Kb
  gzip_comp_level 4;
  gzip_buffers 16 8k;
  gzip_types text/html font/ttf font/opentype image/svg+xml;

  server {
    listen 443 ssl;
    server_name localhost;
    http2 on;

    # Конфигурация ssl
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/ssl/cert.crt;
    ssl_certificate_key /etc/nginx/ssl/cert.key;

    # Кэширование файловых дескрипторов
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Лимиты для защиты
    client_max_body_size 51M;
    client_body_buffer_size 512k;
    client_body_timeout 60s;

    # Таймауты
    keepalive_timeout 60;
    send_timeout 60;

    # Оптимизация
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    sendfile_max_chunk 1m;

    # Безопасность
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # serve static
    location /media-storage/ {
      alias /usr/share/nginx/html/;
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      limit_req zone=media burst=200 delay=100;

      # Видео специфичные настройки
      location ~* \.(mp4|webm|mov|m4v|mkv)$ {
        mp4;
        mp4_buffer_size 2M;
        slice 1m;
        add_header Accept-Ranges bytes;
      }
    }

    # heathcheck для nginx
    location /health {
      return 200;
    }

    # Особенность chrome просто избавление от лишнего запроса
    location /.well-known {
      return 404;
    }

    # Whole application handle
    location / {
      limit_req zone=main burst=50 nodelay;
      proxy_pass http://application:3000/;
      proxy_cache off;

       # Важные хедеры для прокси
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;

      # Preflight запросы (OPTIONS)
      if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,JWT";
        add_header Access-Control-Max-Age 1728000; # 20 days
        return 204;
      }
    }
  }
}